<!DOCTYPE html> <!-- Con esto le decimos al navegador que estamos usando HTML5 -->
<html lang="en"> <!-- Lenguaje de la pagina -->
<head> <!-- Configuracion de la pagina, lo que no se ve en pantalla -->
<meta charset="UTF-8"> <!-- Esta linea permite al navegador agregar caracteres especiales -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Es para que la pagina se adapte a diferentes pantallas -->
<title>Formularios en HTML</title> <!-- Titulo en la pestaña de la ventana -->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Enlaza estilos e iconos externos -->

</head> <!-- Cerramos el encabezado -->
<body> <!-- Cuerpo de la pagina -->

<h2>Formularios con agrupamiento</h2> <!-- Subtitulo -->
<form action="" method="post"> <!-- Inicia formulario -->
<fieldset> <!-- Agrupa campos dentro de un recuadro -->
<legend>Datos personales</legend> <!-- Titulo del recuadro del grupo -->
Nombre y apellido: <!-- Texto descriptivo -->
<input type="text" name="nombre_apellido"><br> <!-- Campo de texto y salto de linea -->
Documento valido: <!-- Texto descriptivo -->
<input type="file" name="documento"><br> <!-- Campo para archivo y salto de linea -->
Fecha de nacimiento: <!-- Texto descriptivo -->

<input type="date" name="fecha_nacimiento"> <!-- Campo con selector de fecha -->
</fieldset> <!-- Fin del grupo -->
<fieldset> <!-- Segundo recuadro del grupo -->
<legend>Datos de estudio:</legend> <!-- Titulo del recuadro -->
Nombre de la escuela: <!-- Texto descriptivo -->
<input type="text" name="escuela"><br> <!-- Campo de texto y salto de linea -->
Certificado valido: <!-- Texto descriptivo -->
<input type="file" name="certificado"><br> <!-- Campo para archivo y salto de linea -->
Fecha de egreso: <!-- Texto descriptivo -->
<input type="date" name="fecha_egreso"> <!-- Campo con selector de fecha -->
</fieldset> <!-- Fin del grupo -->
<br> <!-- Salto de linea -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button> <!-- Boton enviar -->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Boton borrar -->
</form> <!-- Fin del formulario -->

</body> <!-- Cerramos el cuerpo -->
</html> <!-- Cerramos el documento HTML -->
