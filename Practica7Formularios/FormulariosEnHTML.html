<!DOCTYPE html> <!-- Con esto le decimos al navegador que estamos usando HTML5 -->
<html lang="en"> <!-- Lenguaje de la pagina -->
<head> <!-- Configuracion de la pagina, lo que no se ve en pantalla -->
<meta charset="UTF-8"> <!-- Esta linea permite al navegador agregar caracteres especiales -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Es para que la pagina se adapte a diferentes pantallas -->
<title>Formularios en HTML</title> <!-- Titulo en la pestaña de la ventana -->
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> <!-- Enlaza estilos e iconos externos -->

</head> <!-- Cerramos el encabezado -->
<body> <!-- Cuerpo de la pagina -->
<h2>Formulario con botones</h2>
<form action="" method="post">
Ingresa tu nombre:
<input type="text" name="nombre">
<br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>

</body> <!-- Cerramos el cuerpo -->
</html> <!-- Cerramos el documento HTML -->
