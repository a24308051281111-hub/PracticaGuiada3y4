<!DOCTYPE html> <!-- Declara el tipo de documento HTML para que el navegador lo interprete correctamente -->
<html> <!-- Inicio del documento HTML -->
<head>
	<title>pagina web ejempo texto</title> <!-- Define el título que aparece en la pestaña del navegador -->
</head>
<body>

	<!-- Texto plano seguido de un salto de línea explicito <br/> -->
	esta es la linea y acontinuacion insertaremos un saldo de linea <br/>

	<!-- Etiqueta <center>: centra el contenido -->
	<center> esta es otra linea</center>

	<!-- Otro salto de línea -->
	esta es la linea y acontinuacion insertaremos un saldo de linea <br/>

	<!-- Párrafo alineado a la izquierda mediante el atributo align -->
	<p align="left">el parrafo de este texto esta alineado a la isquierda</p>

	<!-- Párrafo alineado al centro mediante el atributo align -->
	<p align="center">el parrafo esta alineado al centro</p>

	<!-- Párrafo alineado a la derecha  -->
	<p align="right">el parrafo de esta linea esta alineado a la derecha</p>

</body> <!-- Cierre del cuerpo del documento -->
</html> <!-- Cierre del documento HTML -->
