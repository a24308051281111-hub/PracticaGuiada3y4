<!DOCTYPE html> <!-- Con esto le decimos al navegador que estamos usando HTML5 -->
<html> <!-- Lenguaje de la pagina -->
<head> <!-- Configuracion de la pagina, lo que no se ve en pantalla -->
	<title>pagina web ejempo texto</title> <!-- Titulo en la pestaña de la ventana -->
</head> <!-- Cerramos el encabezado -->
<body> <!-- Cuerpo de la pagina -->
	esta es la linea y acontinuacion insertaremos un saldo de linea <br/> <!-- Texto con salto de linea -->
	<center> esta es otra linea</center> <!-- Centra el texto en la pantalla -->
	esta es la linea y acontinuacion insertaremos un saldo de linea <br/> <!-- Texto con salto de linea -->
	<p align="left">el parrafo de este texto esta alineado a la isquierda</p> <!-- Parrafo alineado a la izquierda -->
	<p align="center">el parrafo esta alineado al centro</p> <!-- Parrafo alineado al centro -->
	<p align="right">el parrafo de esta linea esta alineado a la derecha</p> <!-- Parrafo alineado a la derecha -->
</body> <!-- Cerramos el cuerpo -->
</html> <!-- Cerramos el documento HTML -->
